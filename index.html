<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6f7ff;--card:#ffffff;--tx:#16324f;--ac:#0d9488;--ok:#16a34a;--no:#dc2626;--in:#eef8fb;--bd:#cfe6ee}

#app{width:100%;max-width:420px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
.bar{flex:none;display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.q{flex:none;max-height:22vh;overflow:auto;background:var(--card);border:3px solid var(--ac);border-radius:12px;padding:7px 9px;font-weight:700;font-size:14px;line-height:1.3}
.o{flex:none;max-height:22vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;line-height:1.25}
.o div{background:var(--card);border-radius:8px;padding:4px 6px;border-left:6px solid}
.cw{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border:3px solid var(--ac);border-radius:14px;image-rendering:pixelated;touch-action:none;background:#f3e3c0}
.msg{flex:none;min-height:20px;font-size:14px;text-align:center;font-weight:700;margin:2px 0}
.dp{flex:none;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,42px);gap:4px;justify-content:center}
.dp button{font-size:19px;border:0;border-radius:12px;background:var(--ac);color:#fff;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.cr{flex:none;text-align:center;font-size:11px;opacity:.7}
.ov{position:fixed;inset:0;background:linear-gradient(160deg,#bdeeff 0%,#fff3b0 60%,#ffd6e7 100%);display:flex;align-items:flex-start;justify-content:center;padding:12px;z-index:5;overflow:auto}
.ov>div{background:var(--card);border:4px solid var(--ac);border-radius:20px;padding:16px;width:100%;max-width:420px;margin:auto;box-shadow:0 10px 0 rgba(13,148,136,.22)}
.ov h1{margin:0 0 4px;font-size:23px;text-align:center;color:#0b6e8a}
.sub{text-align:center;font-size:12px;opacity:.8;margin-bottom:8px}.sub.l{text-align:left;margin:3px 0}
.ov label{display:block;font-size:12px;font-weight:700;margin:8px 0 2px}
.ov input,.ov textarea,.ov select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--bd);border-radius:12px;background:var(--in);color:var(--tx);margin-top:4px}
.ov textarea{font-size:13px;min-height:110px}
.ov button{padding:10px 18px;font-size:15px;font-weight:700;border:0;border-radius:12px;background:var(--ac);color:#fff;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ov button.s{background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
.ov button.m{padding:7px 11px;font-size:13px;margin:6px 4px 0 0}
.err{color:var(--no);font-weight:700;font-size:13px;margin-top:6px;text-align:center}
.ctr{text-align:center}
.card{border:2px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:#d9f2ee;color:#0f766e;font-weight:700}.pill.x{background:#fde4e4;color:#b42323}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;border-bottom:1px solid var(--bd);padding:6px 0}
details{margin-top:10px;background:var(--in);border-radius:10px;padding:8px}summary{font-weight:700;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{margin-top:0!important}
.tw{overflow-x:auto;border:2px solid var(--bd);border-radius:14px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:var(--in);font-size:11px;letter-spacing:.5px;text-align:left;padding:9px;white-space:nowrap}td{padding:9px;border-top:1px solid var(--bd);white-space:nowrap}
.ov button.o{background:#c2410c}.zona{border-color:rgba(217,54,54,.4);background:rgba(217,54,54,.07)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.hd h1{flex:1;margin:0;font-size:20px}.hd button{margin:0!important}
.badge{background:var(--ac);color:#fff;border-radius:9px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.drop{border:3px dashed var(--ac);border-radius:18px;padding:22px 14px;text-align:center;background:var(--in);cursor:pointer}
pre{font-size:12px;white-space:pre-wrap;background:var(--in);padding:8px;border-radius:8px}
.pj{flex:none;max-height:28vh;overflow:auto;background:#fff8dc;border:2px solid #fbbf24;border-radius:12px;padding:10px;font-size:13px;margin:6px 0}.pj button{margin-top:8px;padding:8px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
tr.clk{cursor:pointer}.st-t{color:#15803d;font-weight:700}.st-r{color:#c2410c;font-weight:700}
.ch{display:inline-block;width:36px;height:36px;border-radius:50%;margin:3px 4px;border:3px solid transparent;cursor:pointer}.ch.on{border-color:#f97316;transform:scale(1.15)}
</style></head><body>
<div id="app">
<div id="pvb" style="display:none;justify-content:space-between;align-items:center;background:#fde68a;color:#5b4300;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;margin-bottom:6px">👁 Pratinjau: jawaban tidak disimpan <button onclick="endPV()" style="border:0;border-radius:8px;padding:4px 10px;font-weight:700">Keluar</button></div>
<div class="bar"><span id="no">Lv 1</span><span id="lf"></span><span id="tm" onclick="togSuara()" style="cursor:pointer;font-size:16px">🔊</span><span id="sc">Skor: 0</span></div>
<div class="q" id="q">Memuat...</div>

<div class="cw" id="cw"><canvas id="c" width="320" height="300"></canvas></div>
<div class="msg" id="m"></div>
<div id="pj" class="pj" style="display:none"></div>
<div class="dp">
<span></span><button data-d="u">▲</button><span></span>
<button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button>
</div>
<div class="cr">Design by Akhmad Fitra Harry, S.Pd</div>
</div>
<div class="ov" id="ov"><div id="ovc"></div></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#e8554e","#3b82f6","#f2b705","#2fb86b"],LET="ABCD";
const CF=window.CFG||{};let tok=null;
/* ===== Supabase (REST) ===== */
async function api(p,o={}){
 if(!CF.URL||/XXXX/.test(CF.URL))throw new Error("config.js belum diisi (URL dan KEY Supabase).");
 const r=await fetch(CF.URL+p,{...o,headers:{apikey:CF.KEY,...((tok||/^eyJ/.test(CF.KEY))?{Authorization:"Bearer "+(tok||CF.KEY)}:{}),"Content-Type":"application/json",...(o.headers||{})}});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||"Gagal ("+r.status+")");
 return j;
}
const rpc=(f,a)=>api("/rest/v1/rpc/"+f,{method:"POST",body:JSON.stringify(a)});
const db={sel:(t,q)=>api("/rest/v1/"+t+"?"+q),
 ins:(t,r,h)=>api("/rest/v1/"+t,{method:"POST",headers:h||{},body:JSON.stringify(r)}),
 upd:(t,q,r)=>api("/rest/v1/"+t+"?"+q,{method:"PATCH",body:JSON.stringify(r)}),
 del:(t,q)=>api("/rest/v1/"+t+"?"+q,{method:"DELETE"})};
function overlay(h){$("ovc").innerHTML=h;$("ov").style.display="flex";$("ov").scrollTop=0;}
const busy=t=>overlay(`<div class="ctr"><h1>${t}</h1></div>`);
const fd=(x,d)=>x?new Date(x).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"}):d;
const loc=x=>{if(!x)return"";const d=new Date(x);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);};
const copy=t=>{try{navigator.clipboard.writeText(t);alert("Tersalin!");}catch(e){prompt("Salin teks ini:",t);}};
/* ===== Layar siswa ===== */
async function home(err){PV=null;$("pvb").style.display="none";overlay(`<div class="ctr"><img src="icon-192.png" alt="" width="92" height="92" style="border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.12)"></div><h1 style="margin-top:10px">Asesmen Game</h1><div class="sub" style="font-size:14px">Isi kode kelas, namamu, dan token dari gurumu ✨</div>
<label>Kode kelas</label><input id="t_c" value="${esc(KODEK)}" placeholder="74VT83" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px" onchange="loadKelas()" oninput="if(this.value.trim().length>=6)loadKelas()">
<div id="kinfo" class="sub l" style="min-height:16px"></div>
<div id="nmw">${nameField()}</div>
<label>Token ujian</label><input id="t_k" value="${esc(LAST.t)}" autocapitalize="characters" autocomplete="off" placeholder="CONTOH: ABC123" style="text-transform:uppercase;letter-spacing:2px">
<label>Pilih karakter</label><div class="ctr">${CHS.map((c,k)=>`<span class="ch ${k===CH?"on":""}" style="background:linear-gradient(180deg,${c.r} 42%,${c.b} 42%)" onclick="pilihCh(${k})"></span>`).join("")}</div>
<div class="err">${esc(err)}</div>
<div class="ctr"><button style="background:#f97316;font-size:18px;padding:12px 32px" onclick="mulai()">▶ Mulai</button><br><button class="s m" onclick="guru()">🔑 Masuk Guru</button>${isStd()?"":'<br><button class="s m" style="background:#fff7d6;border-color:#fbbf24;box-shadow:0 4px 0 #fbbf24" onclick="pasang()">📲 Pasang di layar utama</button>'}</div>
<div class="sub" style="margin-top:10px">❤️ Nyawa terbatas • jalan ke jawaban yang benar<br>Design by Akhmad Fitra Harry, S.Pd</div>`);if(KODEK&&!(KODEK in ROSTERS))loadKelas();}
let PV=null,ord=[0,1,2,3],SOAL=[],S={},i=0,correct=0,lives=3,got=0,TOT=1,lock=true,res=null,resKey=null,P={x:152,y:240,w:16,h:20,f:1};
const keys={};
const mkPads=n=>{const w=n===4?70:92,gp=n===4?8:14,x0=(320-(n*w+(n-1)*gp))/2;return Array.from({length:n},(_,k)=>({x:x0+k*(w+gp),y:34,w,h:56,k}));};
let pads=mkPads(4);
const lvl=n=>Math.min(3,Math.floor(n*3/SOAL.length)+1);
let DP=null;
const isStd=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;});
addEventListener("appinstalled",()=>{DP=null;home();});
async function pasang(){
 if(DP){DP.prompt();const c=await DP.userChoice;DP=null;if(c.outcome==="accepted")home();return;}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 overlay(`<h1>📲 Pasang aplikasi</h1><div class="sub l" style="font-size:14px;line-height:1.8;margin:10px 0">${ios?"1. Buka halaman ini di <b>Safari</b>.<br>2. Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).<br>3. Pilih <b>Tambah ke Layar Utama</b>, lalu ketuk <b>Tambah</b>.":"1. Buka halaman ini di <b>Chrome</b>.<br>2. Ketuk menu <b>⋮</b> di pojok kanan atas.<br>3. Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>."}</div><div class="ctr"><button onclick="home()">← Kembali</button></div>`);
}
let KODEK=(()=>{try{const u=new URLSearchParams(location.search).get("k");if(u)return u.toUpperCase();return localStorage.getItem("kode_kelas")||"";}catch(e){return "";}})();
let ROSTERS={},LAST={t:"",n:""};
const kRoster=()=>ROSTERS[KODEK]||[];
const nameField=()=>kRoster().length?`<label>Nama lengkap</label><select id="t_n"><option value="">— Pilih namamu —</option>${kRoster().map(n=>`<option ${n===LAST.n?"selected":""}>${esc(n)}</option>`).join("")}</select>`:`<label>Nama lengkap</label><input id="t_n" placeholder="Nama lengkap" value="${esc(LAST.n)}">`;
async function loadKelas(){
 const k=($("t_c").value||"").trim().toUpperCase(),inf=$("kinfo");KODEK=k;
 if(k.length<4){inf.textContent="";return;}
 inf.style.color="";inf.textContent="Memeriksa kode kelas...";
 try{const d=await rpc("kelas_info",{p_kode:k});if(d.galat)throw new Error(d.galat);ROSTERS[k]=d.siswa||[];try{localStorage.setItem("kode_kelas",k);}catch(e){}
  inf.style.color="var(--ok)";inf.textContent="✅ "+d.nama+(d.sekolah?" · "+d.sekolah:"");}
 catch(e){ROSTERS[k]=[];inf.style.color="var(--no)";inf.textContent="❌ "+e.message;}
 const nw=$("nmw");if(nw&&$("t_c")&&$("t_c").value.trim().toUpperCase()===k)nw.innerHTML=nameField();
}
async function mulai(){
 ac();
 const kelas=($("t_c").value||"").trim().toUpperCase(),kode=$("t_k").value.trim().toUpperCase(),nama=$("t_n").value.trim();
 LAST={t:kode,n:nama};KODEK=kelas;
 if(!kelas)return home("Isi kode kelas dulu.");
 if(!nama)return home("Pilih atau isi namamu dulu.");
 if(!kode)return home("Isi token dulu.");
 busy("Memuat soal...");
 try{
  const d=await rpc("mulai",{p_kelas:kelas,p_kode:kode,p_nama:nama});
  if(d.galat)return home(d.galat);
  S={kode,mapel:d.mapel,nama:d.nama};LAST={t:"",n:""};
  SOAL=d.soal;TOT=SOAL.reduce((a,x)=>a+(x.bobot||1),0)||1;got=0;i=0;correct=0;lives=d.nyawa>0?d.nyawa:Infinity;PV=null;ACT=true;KEL=0;TG=d.tugas||{aktif:false,maks:0,tambah:0,tersedia:0};
  let fin=false;
  if(d.lanjut){const sd=new Set(d.sudah);i=SOAL.findIndex(x=>!sd.has(x.id));correct=d.benar;got=d.got;if(d.nyawa>0)lives=d.nyawa-d.salah+(TG.tambah||0);fin=i<0||lives<=0;}
  $("ov").style.display="none";
  if(fin){if(i>=0&&lives<=0&&canTask())tawarTugas();else{i=Math.max(0,i);finish();}}else{load();if(d.lanjut)$("m").textContent="↻ Melanjutkan pengerjaanmu...";}
 }catch(e){home(e.message);}
}
function load(){
 const s=SOAL[i];lock=false;res=null;resKey=null;P.x=152;P.y=240;
 const raw=[s.a,s.b,s.c,s.d].filter(x=>x!=null&&x!=="");
 const isi=s.tipe==="isian";ord=isi?[]:shuf(raw.map((_,k)=>k));pads=isi?[]:mkPads(raw.length);
 $("no").textContent="Soal "+(i+1)+"/"+SOAL.length;
 $("q").innerHTML=esc(s.tanya)+(s.gambar?`<img src="${s.gambar}" style="display:block;max-width:100%;max-height:90px;margin:4px auto 0;border-radius:8px">`:"");
 $("o").innerHTML=isi?`<div style="grid-column:1/-1;display:flex;gap:6px"><input id="isi_t" autocomplete="off" placeholder="Ketik jawabanmu..." style="flex:1;min-width:0;font-size:16px;padding:8px 10px;border:2px solid var(--ac);border-radius:10px" onkeydown="if(event.key==='Enter')kirimIsian()"><button onclick="kirimIsian()" style="border:0;border-radius:10px;background:#f97316;color:#fff;font-weight:700;padding:0 14px">Kirim ▶</button></div>`:ord.map((oi,k)=>`<div style="border-color:${COL[k]}"><b>${LET[k]}.</b> ${esc(raw[oi])}</div>`).join("");
 $("m").textContent=isi?"Ketik jawabanmu lalu tekan Kirim":"Jalan ke kotak jawaban yang benar!";
 hud();fit();
 if(isi)setTimeout(()=>{const e=$("isi_t");if(e)e.focus();},200);
}
function fit(){const w=$("cw");if(!w||!w.clientHeight)return;const c=$("c"),x=Math.max(120,Math.floor(Math.min(w.clientWidth,w.clientHeight*320/300)));c.style.width=x+"px";c.style.height=Math.round(x*300/320)+"px";}
function hud(){$("lf").textContent=(lives===Infinity?"❤️ ∞":lives>6?"❤️ ×"+lives:"❤️".repeat(Math.max(0,lives)))+(canTask()?" 🎁":"");$("sc").textContent=PV?"Skor: "+Math.round(100*got/TOT):"";}
async function answer(k){
 if(lock)return;lock=true;res=k;let r;
 try{
  r=PV?{kunci:SOAL[i].kunci,penjelasan:SOAL[i].penjelasan}:await rpc("cek2",{p_kode:S.kode,p_soal:SOAL[i].id,p_pilih:k<0?-1:ord[k]});resKey=ord.indexOf(r.kunci);
  if(k===resKey){correct++;got+=SOAL[i].bobot||1;$("m").style.color="var(--ok)";$("m").textContent="✅ Benar! Hebat!";bunyi(true);}
  else{lives--;$("m").style.color="var(--no)";$("m").textContent=(k<0?"⏰ Waktu habis! ":"❌ Salah. ")+"Jawaban: "+LET[resKey];bunyi(false);}
 }catch(e){$("m").textContent="Koneksi bermasalah, mencoba lagi...";res=null;setTimeout(()=>lock=false,1500);return;}
 hud();
 if(k!==resKey&&r.penjelasan){$("pj").innerHTML="<b>💡 Pembahasan:</b> "+esc(r.penjelasan)+'<div class="ctr"><button onclick="nextQ()">Lanjut ▶</button></div>';$("pj").style.display="block";return;}
 setTimeout(nextQ,1500);
}
function nextQ(){$("pj").style.display="none";$("m").style.color="";i++;if(i>=SOAL.length)return finish();if(lives>0)return load();if(canTask())return tawarTugas();finish();}
async function finish(){
 if(PV){lock=true;const n=Math.round(100*got/TOT),sa=PV.sid?"'"+PV.sid+"'":"null";
  overlay(`<div class="ctr"><h1>👁 Pratinjau selesai</h1><div class="sub">Hasil percobaan ini tidak disimpan.</div><div style="font-size:48px;font-weight:800">${n}</div><div class="sub">Benar ${correct} dari ${SOAL.length} soal</div><button onclick="preview('${PV.mid}',${sa})">↻ Coba lagi</button> <button class="s" onclick="endPV()">← Kembali ke soal</button></div>`);return;}
 lock=true;ACT=false;let r;
 try{r=await rpc("selesai",{p_kode:S.kode});}catch(e){r=null;}
 const t=lives<=0?"💔 Nyawa habis!":"🎉 Selesai! Kerja bagus!";
 overlay(`<div class="ctr"><div style="font-size:56px">${lives<=0?"💪":"🏆"}</div><h1>${t}</h1><b>${esc(S.nama)}</b><div class="sub">${esc(S.mapel)}</div>
 <p style="font-size:14px">${r?"Jawabanmu sudah tersimpan.<br>Nilai akan disampaikan oleh gurumu.":"⚠️ Koneksi bermasalah, jawabanmu belum terkirim. Buka lagi dengan token dan nama yang sama untuk mengirim ulang."}</p>
 <button onclick="home()">Selesai</button><div class="sub" style="margin-top:12px">Design by Akhmad Fitra Harry, S.Pd</div></div>`);
}
function tick(dt){
 if(lock)return;
 const v=110*dt;
 const dx=(keys.ArrowRight||keys.d||keys.r?1:0)-(keys.ArrowLeft||keys.a||keys.l?1:0);
 const dy=(keys.ArrowDown||keys.s||keys.d_?1:0)-(keys.ArrowUp||keys.w||keys.u?1:0);
 if(dx)P.f=dx;
 P.x=Math.max(4,Math.min(316-P.w,P.x+dx*v));P.y=Math.max(20,Math.min(296-P.h,P.y+dy*v));
 pads.forEach(p=>{if(P.x+P.w>p.x+6&&P.x<p.x+p.w-6&&P.y<p.y+p.h-4&&P.y+P.h>p.y+10)answer(p.k);});
 if(!lock&&canTask()&&P.x+P.w>36&&P.x<100&&P.y+P.h>240&&P.y<292)bukaTugas("pos");
}
/* ===== Gambar arena ===== */
const g=$("c").getContext("2d"),W=320,H=300;
function tree(x,y){g.fillStyle="#7a4a21";g.fillRect(x-2,y,4,12);g.fillStyle="#2fa84f";g.beginPath();g.arc(x,y-2,10,0,7);g.fill();g.fillStyle="#1f8a3b";g.beginPath();g.arc(x+3,y,6,0,7);g.fill();}

function parseSoal(txt,keys){
 const lines=txt.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean),out=[];
 if(lines.some(l=>l.split("|").length>=5)){
  lines.forEach(l=>{const p=l.split("|").map(x=>x.trim());if(p.length>=5){const z=p[p.length-1];out.push({q:p[0],o:p.slice(1,-1).filter(Boolean),k:z.length===1?LET.indexOf(z.toUpperCase()):-1});}});
 }else{
  let cur=null,last="";
  for(const l of lines){
   let m;
   if(cur&&(m=l.match(/^(?:pembahasan|penjelasan)\s*[:=-]\s*(.*)$/i))){cur.p=m[1];last="p";continue;}
   if(cur&&(m=l.match(/^(?:kunci|jawaban|jwb|key)\s*[:=-]\s*([A-Da-d])\b/i))){cur.k=LET.indexOf(m[1].toUpperCase());continue;}
   if(cur&&cur.o.length<4&&(m=l.match(/^[A-Da-d]\s*[.)]\s*(.*)$/))){cur.o.push(m[1]);last="o";continue;}
   if(m=l.match(/^(\d{1,3})\s*[.)](?!\d)\s*(.*)$/)){cur={q:m[2],o:[],k:-1};out.push(cur);last="q";continue;}
   if(cur){if(last==="o")cur.o[cur.o.length-1]+=" "+l;else if(last==="p")cur.p+=" "+l;else cur.q+=" "+l;}
  }
 }
 for(const m of (keys||"").matchAll(/(\d+)\s*[.:)\-=]?\s*([A-Da-d])(?![a-z])/g)){const q=out[+m[1]-1];if(q)q.k=LET.indexOf(m[2].toUpperCase());}
 return out;
}

async function bacaFile(el){
 const f=el.files[0];if(!f)return;const st=$("im_s"),nm=f.name.toLowerCase();let t="";
 st.textContent="Membaca berkas...";
 if(nm.endsWith(".docx")){await need("mammoth");t=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;}
 else if(nm.endsWith(".pdf")){await need("pdfjs");pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+"pdf.js/3.11.174/pdf.worker.min.js";
  const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  for(let p=1;p<=d.numPages;p++){const c=await(await d.getPage(p)).getTextContent();t+=c.items.map(i=>i.str+(i.hasEOL?"\n":" ")).join("")+"\n";}}
 else if(f.type.startsWith("image/")){await need("ocr");
  const r=await Tesseract.recognize(f,"ind",{logger:m=>{if(m.status==="recognizing text")st.textContent="Membaca foto... "+Math.round(m.progress*100)+"%";}});t=r.data.text;}
 else{st.textContent="";throw new Error("Format tidak didukung. Pakai .docx, .pdf, atau foto.");}
 el.value="";
 if(!t.trim()){st.textContent="";throw new Error("Tidak ada teks terbaca. Jika PDF hasil scan, unggah sebagai foto.");}
 $("im_t").value=t.trim();st.textContent="✅ Selesai. Periksa dan perbaiki teks di bawah.";
}

let TG={aktif:false,maks:0,tambah:0,tersedia:0},TUGAS=null,TMODE="pos",PVT=[],PVU=new Set();

const normT=t=>(t||"").trim().toLowerCase().replace(/\s+/g," ");
async function apiTugas(op,x){
 if(!PV){
  if(op==="ambil")return await rpc("ambil_tugas",{p_kode:S.kode});
  return await rpc("cek_tugas",{p_kode:S.kode,p_soal:TUGAS.id,p_pilih:x.pilih==null?-1:x.pilih,p_teks:x.teks||null});
 }
 if(op==="ambil"){
  const sisa=PVT.filter(t=>!PVU.has(t.id));
  if(!sisa.length||TG.tambah>=TG.maks)return{kosong:true};
  const t=sisa[Math.floor(Math.random()*sisa.length)],m=t.tipe==="isian";
  return{id:t.id,tanya:t.tanya,tipe:t.tipe,a:m?null:t.a,b:m?null:t.b,c:m?null:t.c,d:m?null:t.d,gambar:t.gambar};
 }
 const t=PVT.find(z=>z.id===TUGAS.id);PVU.add(t.id);
 const ok=t.tipe==="isian"?(!!normT(x.teks)&&(t.a||"").split("|").some(v=>normT(v)===normT(x.teks))):x.pilih===t.kunci;
 const beri=ok&&TG.tambah<TG.maks;
 return{benar:ok,ok_nyawa:beri,kunci:t.kunci,kunci_teks:(t.a||"").split("|")[0].trim(),penjelasan:t.penjelasan,tambah:TG.tambah+(beri?1:0),tersedia:PVT.filter(z=>!PVU.has(z.id)).length};
}
